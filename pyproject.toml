[project]
name = "66degrees-content-marketing"
version = "0.1.0"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "mcp>=1.29,<2",
    "uvicorn>=0.30",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
reference = ["chromadb", "sentence-transformers"]
qa = ["rapidfuzz>=3.0"]
llm = ["anthropic", "openai", "google-genai"]
clients = ["openai-agents"]
all = ["chromadb", "sentence-transformers", "anthropic", "openai", "google-genai", "rapidfuzz>=3.0", "openai-agents"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
