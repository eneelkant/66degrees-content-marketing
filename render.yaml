# Render Blueprint: public MCP server.
# Free Docker web service. Listening port is 8000 (Dockerfile CMD and EXPOSE).
# MCP_AUTH_TOKEN is generated and stored by Render. Do not commit that value.
services:
  - type: web
    name: 66degrees-content-mcp
    runtime: docker
    plan: free
    branch: main
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://chatgpt.com,https://claude.ai,https://gemini.google.com
